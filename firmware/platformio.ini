; AIoT PowerGuard - firmware build configuration
; Target: NodeMCU ESP8266 30-pin (nodemcuv2) - the only project MCU (ADR-004).
; P02-T01 scaffold only: no application behavior is implemented yet.

[platformio]
default_envs = nodemcuv2
src_dir = src
include_dir = include
lib_dir = lib
test_dir = test

; Host unit tests: `pio test -e native`. Requires a host g++ on PATH, in a path
; without spaces on Windows.
; power_sensor.cpp IS built here and driven through the controllable INA226/Wire
; fake in test/stubs, and display_format.cpp is pure logic with no Arduino.
; display.cpp (the MAX7219 pin driver), wifi_manager.cpp and mqtt_manager.cpp
; are left out:
; they need the ESP8266 Wi-Fi stack and a live broker, so they stay hardware and
; network evidence (docs/hardware-test-checklist.md).
[env:native]
platform = native
test_framework = unity
test_filter = test_native
test_build_src = yes
build_flags =
	-std=gnu++17
	-Wall
	-Wextra
	-I include
	-I test/stubs
	-DPOWERGUARD_FIRMWARE_VERSION=\"0.1.0\"
	-DPOWERGUARD_MAX_EXPECTED_CURRENT_A=5.0f
build_src_filter =
	+<config.cpp>
	+<measurement.cpp>
	+<telemetry.cpp>
	+<backoff.cpp>
	+<diagnostics.cpp>
	+<scheduler.cpp>
	+<power_sensor.cpp>
	+<display_format.cpp>

[env:nodemcuv2]
test_ignore = test_native
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
	-Wall
	-Wextra
	-DPOWERGUARD_FIRMWARE_VERSION=\"0.1.0\"

; Direct dependencies only, pinned (TECH_STACK.md: INA226 driver + ArduinoMqttClient).
; Declared here at P02-T01; wired up in later Phase 02 tasks.
lib_deps =
	robtillaart/INA226@0.6.6
	arduino-libraries/ArduinoMqttClient@0.1.8

lib_ldf_mode = chain+
