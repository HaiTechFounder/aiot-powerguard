# Optional local broker. Docker is never required: the mandatory Phase 03
# software gate runs entirely against the fake MQTT transport.
#
# Create deploy/mosquitto/passwd FIRST — compose fails without it, because the
# file is mounted read-only. See deploy/mosquitto/README.md.
#
#   docker compose up -d mosquitto
#   docker compose logs -f mosquitto
#   docker compose down -v
services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: powerguard-mosquitto
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    ports:
      # The host bind address is always explicit, and defaults to loopback.
      #
      # A bare "1883:1883" publishes on *every* interface the host has, which
      # for a broker with no TLS means any network it is attached to, including
      # untrusted Wi-Fi. That is never the right default.
      #
      # An ESP8266 is a separate device and does need LAN reach, so that case is
      # an explicit act: set POWERGUARD_MQTT_BIND to the host's own LAN address
      # (for example 192.168.1.42) for the duration of a capture. One named
      # interface, not all of them. Authentication and the ACL stay on either
      # way; see deploy/mosquitto/README.md for the firewall assumptions.
      #
      # The in-container listener binds 0.0.0.0 because it binds inside the
      # container's network namespace; a loopback bind there would be
      # unreachable through any published port.
      - "${POWERGUARD_MQTT_BIND:-127.0.0.1}:1883:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.docker.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/acl:/mosquitto/config/acl:ro
      # Generated locally and git-ignored; see deploy/mosquitto/README.md.
      - ./deploy/mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data
    restart: "no"

volumes:
  # Named, so `docker compose down -v` removes it and nothing is left on disk.
  mosquitto-data:
