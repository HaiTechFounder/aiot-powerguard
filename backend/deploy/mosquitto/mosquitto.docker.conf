# Local development broker for PowerGuard — container.
# Not a production configuration.
#
# The listener binds to 0.0.0.0 because it binds inside the container's own
# network namespace; a loopback bind here would be unreachable through the
# published port. Exposure is restricted on the host side instead, by the
# `127.0.0.1:1883:1883` mapping in compose.yaml. TLS is deliberately absent.
#
# Paths are the container paths that compose.yaml mounts.

listener 1883 0.0.0.0
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type error
