# Local development broker for PowerGuard — native Windows or Linux.
# Not a production configuration.
#
# Run it from the `backend` directory, so the relative paths below resolve:
#
#   mosquitto -c deploy/mosquitto/mosquitto.native.conf -v
#
# The listener binds to loopback, so nothing on the LAN can reach it. TLS is
# deliberately absent: this broker is for a single machine only.

listener 1883 127.0.0.1
protocol mqtt

allow_anonymous false
password_file deploy/mosquitto/passwd
acl_file deploy/mosquitto/acl

# Off by default: a native run leaves nothing behind to clean up.
persistence false

log_dest stdout
log_type warning
log_type error
