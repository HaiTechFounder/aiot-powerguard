[build-system]
# Pinned exactly: an open-ended range would let pip resolve a different build
# backend into the isolated build environment, so the "fully pinned" claim
# would not be reproducible. `requirements-build.lock` mirrors these versions
# for installs that pass --no-build-isolation.
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "powerguard-backend"
version = "0.1.0"
description = "AIoT PowerGuard backend: MQTT ingestion, persistence, REST and WebSocket API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Direct dependencies only. Exact transitive pins live in the lock files.
# Python 3.12 is canonical; 3.11 is supported so the project runs on this machine.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "paho-mqtt>=2.1,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pip-tools>=7.4,<8.0",
]

[project.scripts]
powerguard = "powerguard.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = [
    "A003",  # attribute shadowing a builtin is fine for ORM columns such as `id`
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"alembic/versions/*" = ["E501", "N999"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
plugins = []

[[tool.mypy.overrides]]
# paho-mqtt ships partial typing and does not re-export every public name.
module = ["paho.*"]
ignore_missing_imports = true
implicit_reexport = true
follow_imports = "skip"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: needs a live broker or other external service",
]

[tool.coverage.run]
branch = true
source = ["src/powerguard"]

[tool.coverage.report]
show_missing = true
skip_covered = true
